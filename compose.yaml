services:
  webstreamr:
    image: ghcr.io/movhika/mystreamr:latest
    container_name: webstreamr
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CACHE_DIR: /app/cache
    ports:
      - "${PORT:-51546}:${PORT:-51546}"
    volumes:
      - mystreamr-cache:/app/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require("node:http").get("http://127.0.0.1:" + (process.env.PORT || 51546) + "/ready", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mystreamr-cache:
