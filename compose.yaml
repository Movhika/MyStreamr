services:
  mystreamr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mystreamr
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-51546}
      CACHE_DIR: /app/cache
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:?Set TMDB_ACCESS_TOKEN in .env}
      CONFIGURATION_DESCRIPTION: ${CONFIGURATION_DESCRIPTION:-}
      DISABLED_EXTRACTORS: ${DISABLED_EXTRACTORS:-}
      DISABLED_SOURCES: ${DISABLED_SOURCES:-}
      FLARESOLVERR_ENDPOINT: ${FLARESOLVERR_ENDPOINT:-}
      MANIFEST_ID: ${MANIFEST_ID:-webstreamr-mbg}
      MANIFEST_NAME: ${MANIFEST_NAME:-WebStreamrMBG}
      PROXY_CONFIG: ${PROXY_CONFIG:-}
    ports:
      - "${PORT:-51546}:${PORT:-51546}"
    volumes:
      - mystreamr-cache:/app/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require("node:http").get("http://127.0.0.1:" + (process.env.PORT || 51546) + "/ready", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on("error", () => process.exit(1))'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mystreamr-cache:
